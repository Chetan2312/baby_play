# Takatak vision service configuration. Every threshold lives here.

# Hardware profile. Models (HEF) are compiled per accelerator and are NOT
# interchangeable: each profile has its own models_dir. See docs/model_matrix.md.
hardware:
  profile: devrig                 # devrig | kit | n150 (TAKATAK_PROFILE env or --profile override this)
profiles:
  devrig:                         # Pi 5 8 GB + AI HAT+ 26 TOPS + CM3 Wide (+ CM3 NoIR)
    accelerator: hailo8
    models_dir: models/hailo8
    cameras: [wide, noir]
    default_camera: wide
  kit:                            # Pi 5 16 GB + AI HAT+ 2 + Raspberry Pi AI Camera (UNVERIFIED: no kit yet)
    accelerator: hailo10h
    models_dir: models/hailo10h
    cameras: [imx500]
    default_camera: imx500
  n150:                           # Intel N150 mini PC (Ubuntu 24.04): USB UVC webcam + OpenVINO on the iGPU
    accelerator: openvino
    device: GPU                   # GPU | CPU (GPU falls back to CPU with a warning when it can't load)
    models_dir: models/openvino
    model: yolov8n-pose_384x640_fp16  # IR folder (model.xml + model.bin), made by tools/export_pose_openvino.py
    camera_backend: v4l2
    cameras: [usb]
    default_camera: usb
    overrides:                    # merged over the settings below for this profile only
      camera_opts:
        rotation: normal
        hw_flip: false            # UVC cameras don't flip on the sensor
      hands:
        workers: 1                # 4 cores, no Hyper-Threading: camera decode + JPEG + game need the rest
      thermal:
        throttle_c: 90            # N150 Tjmax 105 °C; lower for a fanless unit after the soak test

camera: default                   # default (profile's) | wide | noir | imx500 | usb | auto (game: set_camera)
camera_index: { wide: 0, noir: 1, imx500: 0 }  # fallback if sensor model names can't be matched
camera_opts:
  main_size: [1920, 1080]         # capture: hand tracking cuts the hands from this
  transport_size: [960, 540]      # JPEG for the game (main is downscaled to this)
  rotation: inverted              # normal | right | inverted | left: turn the picture when the camera is
                                  # mounted sideways / upside down (the game's supervisor menu overrides this)
  hw_flip: true                   # inverted = sensor h+v flip (free); false = turn every frame in software
  framerate: 30                   # try 50 for a snappier pointer (camera latency ↓, pose rate ↑) if the Pi keeps up: check ./run.sh debug fps
  auto_brightness_threshold: 60   # camera: auto → mean luma (0-255) below this picks noir
  auto_probe_frames: 15
  controls: {}                    # extra libcamera controls, e.g. { AeMeteringMode: 0 }
  v4l2:                           # camera_backend v4l2 (USB webcam, n150 profile)
    device: auto                  # auto = first /dev/v4l/by-id/*-video-index0, or a path
    controls:                     # set with v4l2-ctl before opening (names: v4l2-ctl -d <dev> --list-ctrls)
      exposure_dynamic_framerate: 1   # Arducam 16MP: 0 caps the exposure and the picture goes almost black
                                      # (mean luma 9 vs 100 in a dim room); fps was the same (26) either way
      backlight_compensation: 2       # people in front of a bright window stop going dark
      brightness: 15                  # picked live on the N150 room (2026-11-02): defaults looked dull and dark
      gamma: 150
      saturation: 80
      contrast: 32
      gain: 0                         # gain lifts the picture too but washes out the background

display:
  mirror: true                    # frames AND coordinates are sent pre-mirrored

model: yolov8s_pose.hef           # file name inside the profile's models_dir

inference:
  input_size: 640
  swap_rb: true                   # Picamera2 "RGB888" is BGR in memory; model wants RGB
  min_person_conf: 0.5
  min_kp_conf: 0.3
  nms_iou: 0.7
  max_people: 6
  pad_value: 114
  cache_dir: ~/.cache/takatak/openvino  # OpenVINO: compiled GPU kernels (first start ~10 s, then fast)

smoothing:
  # one_euro: smooth when still, almost no lag when moving fast (pointers, popping).
  # ema: fixed blend (the Phase 2 filter; always trails by about a frame).
  filter: one_euro
  one_euro:                       # keypoints are in lores pixels (640 wide)
    min_cutoff: 1.2               # Hz at rest: lower = steadier when still, more lag
    beta: 0.04                    # cutoff rise per px/s of speed: higher = less lag on fast moves
    d_cutoff: 1.0                 # Hz for the speed estimate
  ema_alpha: 0.5                  # filter: ema
  face_memory_s: 0.5              # keep last confident face keypoints while a hand covers the face

tracker:
  mode: single                    # single | duo (game: set_players)
  select: largest                 # largest | center
  lost_grace_s: 0.7               # keep identity through short dropouts
  max_jump: 0.6                   # max centre move per frame, fraction of bbox height

gesture_events:
  start_frames: 2                 # consecutive true frames → "start"
  hold_frames: 6                  # consecutive true frames → "held"
  miss_frames: 1                  # tolerated false frames before "end"

# Static gesture tolerances in units of S (shoulder width). Game picks with set_difficulty.
gestures:
  default_difficulty: toddler
  toddler:
    nose_dist: 0.8
    ear_dist: 0.8
    head_above_eyes: 0.1
    head_max_above_eyes: 1.5
    head_x: 1.0
    hands_up_above_nose: 0.3
    tummy_frac: 0.6
    tummy_dist: 0.9
    shoulder_dist: 0.8
    knee_dist: 1.0
    clap_dist: 0.55
    clap_y_margin: 0.5
    left_up_above_nose: 0.0
    other_hand_below_shoulders: 0.0
    neutral_below_shoulders: 1.1
    torso_ratio: 1.2              # hip estimate when hips are out of frame
    nose_above_shoulders: 0.8     # nose estimate when the face is hidden
    scale_bbox_frac: 0.25         # S fallback when shoulders are missing
    scale_min_bbox_frac: 0.15     # S floor (child turned sideways)
  kid:
    nose_dist: 0.6
    ear_dist: 0.6
    head_above_eyes: 0.2
    head_max_above_eyes: 1.5
    head_x: 0.8
    hands_up_above_nose: 0.5
    tummy_frac: 0.6
    tummy_dist: 0.7
    shoulder_dist: 0.6
    knee_dist: 0.8
    clap_dist: 0.4
    clap_y_margin: 0.3
    left_up_above_nose: 0.0
    other_hand_below_shoulders: 0.0
    neutral_below_shoulders: 1.1
    torso_ratio: 1.4
    nose_above_shoulders: 0.8
    scale_bbox_frac: 0.25
    scale_min_bbox_frac: 0.15

server:
  host: 127.0.0.1
  port: 8765
  frame_fps: 30                   # max JPEG rate (latest-wins per client)
  jpeg_quality: 70
  status_every_s: 1.0
  no_player_after_s: 1.0          # start sending no_player after this long without an active player
  no_player_every_s: 0.5

thermal:
  throttle_c: 80
  hysteresis_c: 5
  throttled_frame_fps: 15

paths:
  perf_log: ../logs/vision_perf.log   # fps + temperature only: no frames, keypoints or audio
  sessions: ../logs/sessions      # DEV ONLY: tools/record_session.py output (not in field builds)
  tmp_audio: /run/takatak         # echo/voice temp files (Phase P5): RAM-only tmpfs, never the SSD

perf:
  log_every_s: 5

# Single worker button on a GPIO pin (gpiozero). Short press = start/next,
# 2 s = stop, 5 s = supervisor menu (timing lives in the game's InputRouter).
gpio_button:
  enabled: false
  pin: 17                         # BCM numbering; button to GND, internal pull-up
  bounce_s: 0.05

# Hand tracking (21 landmarks per hand, MediaPipe on the CPU): runs only while a game
# subscribes to hands (Bubble Pop). Needs vision/requirements-hands.txt + the model file
# (vision/tools/fetch_hand_model.sh); without them games fall back to the arm pointer.
hands:
  enabled: true
  model: models/hand_landmarker.task
  backend: litert                 # litert: landmark model only (from the .task), no palm detector: the
                                  #   box comes from the pose / last frame's hand. ~3× faster on the Pi.
                                  # mediapipe: full Hand Landmarker (palm detector + landmarks), slower
  landmarks: lite                 # litert: lite (~2× faster, from the mediapipe package) | full (the .task's)
  workers: 2                      # litert: hands run in parallel on this many interpreters
  threads: 1                      # litert: CPU threads per interpreter. Keep workers × threads ≤ 2 on a
                                  # Pi 5: camera, pose, JPEG and the game need the other cores
                                  # (measured: 2 × 2 dropped the camera from 30 to ~19 fps)
  only_raised: true               # track only raised hands (wrist above elbow): pointing is up
  box_scale: 2.4                  # hand box side ÷ estimated hand length (finding a hand from the pose)
  min_conf: 0.4                   # hand presence below this → no hand (box goes back to the pose)
  process: true                  # true = hand model in its own process (either backend): the hands then share
                                  # no Python lock with camera / pose / JPEG. Try it if pose latency (lat)
                                  # rises with hands on; costs some memory and ~1 ms per hand for the pipe.
  other_every: 3                  # while a hand points, other hands are tracked every Nth frame
  one_euro:                       # finger smoothing: quicker than the body points
    min_cutoff: 2.0
    beta: 0.08

privacy:
  save_frames: false              # the service never writes frames; must stay false
