# Takatak vision service configuration. Every threshold lives here.

camera: wide                      # wide | noir | auto (game can change it: set_camera)
camera_index: { wide: 0, noir: 1 }  # fallback if sensor model names can't be matched
camera_opts:
  main_size: [960, 540]           # display/transport stream (ISP scales; JPEG'd for the game)
  framerate: 30
  auto_brightness_threshold: 60   # camera: auto → mean luma (0-255) below this picks noir
  auto_probe_frames: 15
  controls: {}                    # extra libcamera controls, e.g. { AeMeteringMode: 0 }

display:
  mirror: true                    # frames AND coordinates are sent pre-mirrored

model: models/yolov8s_pose.hef

inference:
  input_size: 640
  swap_rb: true                   # Picamera2 "RGB888" is BGR in memory; model wants RGB
  min_person_conf: 0.5
  min_kp_conf: 0.3
  nms_iou: 0.7
  max_people: 6
  pad_value: 114

smoothing:
  ema_alpha: 0.5
  face_memory_s: 0.5              # keep last confident face keypoints while a hand covers the face

tracker:
  mode: single                    # single | duo (game: set_players)
  select: largest                 # largest | center
  lost_grace_s: 0.7               # keep identity through short dropouts
  max_jump: 0.6                   # max centre move per frame, fraction of bbox height

gesture_events:
  start_frames: 2                 # consecutive true frames → "start"
  hold_frames: 6                  # consecutive true frames → "held"
  miss_frames: 1                  # tolerated false frames before "end"

# Static gesture tolerances in units of S (shoulder width). Game picks with set_difficulty.
gestures:
  default_difficulty: toddler
  toddler:
    nose_dist: 0.8
    ear_dist: 0.8
    head_above_eyes: 0.1
    head_max_above_eyes: 1.5
    head_x: 1.0
    hands_up_above_nose: 0.3
    tummy_frac: 0.6
    tummy_dist: 0.9
    shoulder_dist: 0.8
    knee_dist: 1.0
    clap_dist: 0.55
    clap_y_margin: 0.5
    left_up_above_nose: 0.0
    other_hand_below_shoulders: 0.0
    neutral_below_shoulders: 1.1
    torso_ratio: 1.2              # hip estimate when hips are out of frame
    nose_above_shoulders: 0.8     # nose estimate when the face is hidden
    scale_bbox_frac: 0.25         # S fallback when shoulders are missing
    scale_min_bbox_frac: 0.15     # S floor (child turned sideways)
  kid:
    nose_dist: 0.6
    ear_dist: 0.6
    head_above_eyes: 0.2
    head_max_above_eyes: 1.5
    head_x: 0.8
    hands_up_above_nose: 0.5
    tummy_frac: 0.6
    tummy_dist: 0.7
    shoulder_dist: 0.6
    knee_dist: 0.8
    clap_dist: 0.4
    clap_y_margin: 0.3
    left_up_above_nose: 0.0
    other_hand_below_shoulders: 0.0
    neutral_below_shoulders: 1.1
    torso_ratio: 1.4
    nose_above_shoulders: 0.8
    scale_bbox_frac: 0.25
    scale_min_bbox_frac: 0.15

server:
  host: 127.0.0.1
  port: 8765
  frame_fps: 30                   # max JPEG rate (latest-wins per client)
  jpeg_quality: 70
  status_every_s: 1.0
  no_player_after_s: 1.0          # start sending no_player after this long without an active player
  no_player_every_s: 0.5

thermal:
  throttle_c: 80
  hysteresis_c: 5
  throttled_frame_fps: 15

paths:
  perf_log: ../logs/vision_perf.log
  sessions: ../logs/sessions      # tools/record_session.py output (keypoints only by default)

perf:
  log_every_s: 5

privacy:
  save_frames: false              # the service never writes frames; must stay false
