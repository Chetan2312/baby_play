# Finger Math (5–6 years): a question with pictures to count ("2 + 1 = ?"), spoken aloud.
# The child ANSWERS WITH FINGERS: all raised fingers of the playing child's hands are added
# up (3 + 3 → 5+1, 3+3, 2+4 … all count as 6). An answer locks in when the total stays the
# same for hold_s. Right → +1; wrong → −1 with a light red flash, counted once until the
# total changes. Needs hand tracking (vision/config.yaml "hands").
game: finger_math
title: { mr: "बोटांचे गणित", hi: "उंगलियों का गणित", en: "Finger math" }
intro_line: math_intro
hint_prefix: math_hint                # math_hint_01, _02 … (with numbered pictures)
perfect_line: bubble_perfect
plus_line: math_plus
minus_line: math_minus
q_count_line: math_q_count
q_add_line: math_q_add
q_sub_line: math_q_sub
try_again_line: math_try_again
no_hands_line: math_no_hands          # hand tracking isn't running
session_level: { toddler: easy, kid: medium }
number_words: [word_one, word_two, word_three, word_four, word_five, word_six, word_seven, word_eight, word_nine, word_ten]

settings:
  intro_arm_s: 0.8
  hold_s: 1.0                   # same finger total this long = an answer
  prompt_timeout_s: 12          # no answer this long (voice lines don't count) → hint: numbered pictures
  round_timeout_s: 30           # → the answer is shown and spoken, next question
  celebrate_s: 2.4
  summary_s: 4.5
  perfect_s: 7.0
  try_again_every_s: 5

# kinds: count ("How many?") · add (a + b) · sub (a − b, taken-away pictures crossed out)
levels:
  easy:   { rounds: 5, kinds: [count],      min_answer: 1, max_answer: 5 }
  medium: { rounds: 6, kinds: [count, add], min_answer: 1, max_answer: 5 }
  hard:   { rounds: 8, kinds: [add, sub],   min_answer: 1, max_answer: 10 }

# Pictures to count (CC0 / public domain photos, see packs/local_fruits/CREDITS.md)
pictures:
  - { id: mango,       word: word_mango,       image: packs/local_fruits/mango.webp,       color: [1.0, 0.72, 0.2] }
  - { id: grapes,      word: word_grapes,      image: packs/local_fruits/grapes.webp,      color: [0.55, 0.85, 0.35] }
  - { id: pomegranate, word: word_pomegranate, image: packs/local_fruits/pomegranate.webp, color: [0.95, 0.3, 0.35] }
  - { id: tomato,      word: word_tomato,      image: packs/local_fruits/tomato.webp,      color: [1.0, 0.35, 0.25] }
