# Game voice lines. DRAFT Hindi/Marathi — needs native review + real recordings.
# `text` is shown on screen ({n} = score), `say` (optional) is what the clip speaks.
greeting:
  text: { en: "Hi! Let's play!", hi: "नमस्ते! चलो खेलें!", mr: "नमस्कार! चला खेळूया!" }
come_back:
  text: { en: "Come to the magic mat!", hi: "जादुई चटाई पर आओ!", mr: "जादूच्या चटईवर ये!" }
hint:
  text: { en: "Watch me and try!", hi: "मुझे देखो और करो!", mr: "मला बघ आणि कर!" }
next:
  text: { en: "Let's try another one!", hi: "चलो, अगला करते हैं!", mr: "चला, पुढचं करूया!" }
finish:
  text: { en: "You did {n}! Great job!", hi: "तुमने {n} किए! शाबाश!", mr: "तू {n} केलेस! शाब्बास!" }
  say: { en: "Great job!", hi: "शाबाश!", mr: "शाब्बास!" }
